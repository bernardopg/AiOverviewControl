name: Contributors

on:
  push:
    branches: [main]
  schedule:
    # Contributions can land without a push to main (a merge commit authored by
    # someone else), so refresh weekly as well.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  avatars:
    name: Refresh contributor avatars
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Rewrites the avatar row between the CONTRIBUTORS markers in README.md
      # and docs/README.pt-BR.md. Avatars only: the names, commit counts and
      # thank-you copy that this list used to carry went stale on every merge.
      - name: Render avatar grid
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/render-contributors

      - name: Report grid changes for protected PR delivery
        run: |
          if git diff --quiet -- README.md docs/README.pt-BR.md; then
            echo "Contributor avatars already up to date."
            exit 0
          fi
          echo "::notice::Avatar changes are available; run scripts/render-contributors on a PR branch and add an Unreleased note."
          {
            echo '## Contributor avatar update proposal'
            echo 'Apply this renderer output through a regular PR; protected main has no bot bypass.'
            echo '```diff'
            git diff -- README.md docs/README.pt-BR.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
