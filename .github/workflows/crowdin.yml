name: Crowdin sync

# Keeps the Crowdin project (.github/crowdin.yml) in step with the repository.
# Translations are reviewed in pull requests, so the repository is the source
# of truth for what ships; Crowdin is where translators propose changes.
#
# - A push to main that touches a bundle downloads Crowdin's translations and
#   compares them with the new commit and with the one before the push. Equal
#   to the new commit: Crowdin already holds this change, nothing to upload.
#   Equal to the previous commit: sources and translations are uploaded, with
#   the repository's translations approved. Neither: a translator changed
#   something in Crowdin that never reached the repository, so nothing is
#   overwritten and the job fails with the list.
# - Every week the same comparison runs against main, so an edit made in
#   Crowdin shows up as a failed run until `crowdin download` brings it in.

on:
  push:
    branches: [main]
    paths:
      - "i18n/**"
      - "translations/**"
      - ".github/crowdin.yml"
      - ".github/workflows/crowdin.yml"
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  CROWDIN_CLI_VERSION: "5.3.0"
  CROWDIN_CLI_SHA256: "d3f8e74471b98d47c0964e85c992a04eb411d06138c4239118a4c94d29e3e9e4"

jobs:
  sync:
    name: Sync translations with Crowdin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Crowdin CLI (verified checksum)
        run: |
          curl -fsSL --retry 3 --max-time 180 \
            "https://github.com/crowdin/crowdin-cli/releases/download/${CROWDIN_CLI_VERSION}/crowdin-linux-x64" \
            -o /tmp/crowdin
          echo "${CROWDIN_CLI_SHA256}  /tmp/crowdin" | sha256sum --check --strict
          chmod +x /tmp/crowdin
          /tmp/crowdin --version | grep -Fx "$CROWDIN_CLI_VERSION"

      - name: Write the Crowdin identity
        env:
          CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}
        run: |
          if [ -z "${CROWDIN_API_TOKEN:-}" ]; then
            echo "::error::CROWDIN_API_TOKEN is not set; the sync cannot reach Crowdin."
            exit 1
          fi
          umask 077
          python3 -c 'import json, os; print(json.dumps({"api_token": os.environ["CROWDIN_API_TOKEN"]}))' \
            > /tmp/crowdin-identity.yml

      # Crowdin is in step when it matches the new commit (already synced, for
      # example by hand or by an earlier run) or the commit before the push
      # (this push brings the change). The download always uses the current
      # crowdin.yml, so a newly mapped file is exported too.
      - name: Compare Crowdin with the repository
        id: compare
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          mkdir -p /tmp/export/i18n /tmp/export/translations /tmp/export/.github
          cp .github/crowdin.yml /tmp/export/.github/crowdin.yml
          cp i18n/en.json /tmp/export/i18n/en.json
          cp translations/en.json /tmp/export/translations/en.json
          (cd /tmp/export && /tmp/crowdin download --config .github/crowdin.yml \
            --identity /tmp/crowdin-identity.yml --no-progress --no-colors)

          mkdir -p /tmp/current
          git archive HEAD i18n translations | tar -x -C /tmp/current
          if scripts/crowdin-drift /tmp/export /tmp/current > /tmp/drift-current.txt; then
            echo "Crowdin already matches $(git rev-parse --short HEAD); nothing to upload." >> "$GITHUB_STEP_SUMMARY"
            echo "upload=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reference=""
          if [ "$EVENT_NAME" = push ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            reference="$BEFORE_SHA"
            mkdir -p /tmp/previous
            git archive "$reference" i18n translations | tar -x -C /tmp/previous
            if scripts/crowdin-drift /tmp/export /tmp/previous > /tmp/drift-previous.txt; then
              echo "Crowdin matches the commit before the push; uploading." >> "$GITHUB_STEP_SUMMARY"
              echo "upload=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          {
            echo "## Crowdin differs from \`$(git rev-parse --short HEAD)\`"
            echo '```'
            cat /tmp/drift-current.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do echo "::warning::$line"; done < /tmp/drift-current.txt
          echo "::error::Crowdin holds translations the repository does not. Run 'crowdin download --config .github/crowdin.yml', review the diff in a pull request, then re-run this workflow."
          exit 1

      - name: Upload sources and translations
        if: steps.compare.outputs.upload == 'true'
        run: |
          /tmp/crowdin upload sources --config .github/crowdin.yml \
            --identity /tmp/crowdin-identity.yml --no-progress --no-colors
          /tmp/crowdin upload translations --auto-approve-imported --import-eq-suggestions \
            --config .github/crowdin.yml --identity /tmp/crowdin-identity.yml --no-progress --no-colors
