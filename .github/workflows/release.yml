name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  package_and_release:
    name: Package and release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref and version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq --exit-status --raw-output '.version' plugin.json)"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::plugin.json version '${VERSION}' is not semver (expected X.Y.Z)" >&2
            exit 1
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match plugin.json version v${VERSION}" >&2
            exit 1
          fi
          RELEASE_COMMIT="$(git rev-list --max-count=1 "$TAG")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/main"; then
            echo "::error::Release tag ${TAG} is not on the main branch" >&2
            exit 1
          fi
          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
            echo "DIST_NAME=AiOverviewControl-${TAG}"
          } >> "$GITHUB_ENV"

      - name: Build and validate release artifacts
        run: |
          scripts/package-release "$TAG"
          {
            echo "## Release artifacts"
            echo ""
            echo "| File | Size |"
            echo "| ---- | ---- |"
            while IFS= read -r -d '' f; do
              size="$(du -sh "$f" | cut -f1)"
              echo "| $(basename "$f") | ${size} |"
            done < <(find dist -maxdepth 1 -name "${DIST_NAME}.*" -type f -print0 | sort -z)
            echo ""
            echo "### SHA-256 checksums"
            echo '```'
            cat "dist/${DIST_NAME}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ env.TAG }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/${{ env.DIST_NAME }}.zip
            dist/${{ env.DIST_NAME }}.tar.gz
            dist/${{ env.DIST_NAME }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
