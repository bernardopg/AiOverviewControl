name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml
    # Pass only what CI reads; never forward every repository secret.
    secrets:
      CROWDIN_API_TOKEN: ${{ secrets.CROWDIN_API_TOKEN }}

  package_and_release:
    name: Package and release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      # Signed SLSA build provenance for the published archives.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release ref and version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(jq --exit-status --raw-output '.version' plugin.json)"
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::plugin.json version '${VERSION}' is not semver (expected X.Y.Z)" >&2
            exit 1
          fi
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "::error::Tag ${TAG} does not match plugin.json version v${VERSION}" >&2
            exit 1
          fi
          RELEASE_COMMIT="$(git rev-list --max-count=1 "$TAG")"
          if ! git merge-base --is-ancestor "$RELEASE_COMMIT" "origin/main"; then
            echo "::error::Release tag ${TAG} is not on the main branch" >&2
            exit 1
          fi
          # Only a tag signed by a maintainer key listed on main is released;
          # the key list comes from main, not from the tagged commit.
          git show origin/main:.github/release-signing-keys.asc | gpg --batch --quiet --import
          # checkout can leave a lightweight ref; refetch the annotated tag object.
          git fetch --quiet --force origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          if ! git verify-tag "$TAG"; then
            echo "::error::Release tag ${TAG} is not signed by a key in .github/release-signing-keys.asc (create it with git tag -s)" >&2
            exit 1
          fi
          {
            echo "TAG=${TAG}"
            echo "VERSION=${VERSION}"
            echo "DIST_NAME=AiOverviewControl-${TAG}"
          } >> "$GITHUB_ENV"

      - name: Build and validate release artifacts
        run: |
          scripts/package-release "$TAG"
          {
            echo "## Release artifacts"
            echo ""
            echo "| File | Size |"
            echo "| ---- | ---- |"
            while IFS= read -r -d '' f; do
              size="$(du -sh "$f" | cut -f1)"
              echo "| $(basename "$f") | ${size} |"
            done < <(find dist -maxdepth 1 -name "${DIST_NAME}.*" -type f -print0 | sort -z)
            echo ""
            echo "### SHA-256 checksums"
            echo '```'
            cat "dist/${DIST_NAME}.sha256"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Extract release notes from CHANGELOG
        run: |
          # The same executable contract gates PRs, packaging and publication.
          # Use the exact version section; relative links point at the immutable tag.
          scripts/check-changelog --notes --repository "$GITHUB_REPOSITORY" \
            --tag "$TAG" > dist/RELEASE_NOTES.md

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/${{ env.DIST_NAME }}.zip
            dist/${{ env.DIST_NAME }}.tar.gz

      # The signed Sigstore bundle is also published as a release asset, so
      # offline verifiers and OpenSSF Scorecard find it next to the archives.
      - name: Publish provenance bundle
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" "dist/${DIST_NAME}.intoto.jsonl"

      # The runner's gh CLI publishes directly, so no third-party action holds
      # contents: write. --verify-tag refuses to create a tag that was not pushed.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            --notes-file dist/RELEASE_NOTES.md \
            "dist/${DIST_NAME}.zip" \
            "dist/${DIST_NAME}.tar.gz" \
            "dist/${DIST_NAME}.sha256" \
            "dist/${DIST_NAME}.intoto.jsonl"
