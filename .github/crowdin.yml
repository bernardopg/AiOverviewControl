project_id: "899362"
base_path: ".."
base_url: "https://api.crowdin.com"
preserve_hierarchy: true

files:
  # Plugin UI strings, loaded by AiOverviewControlI18n.qml.
  - source: "/i18n/en.json"
    translation: "/i18n/%locale_with_underscore%.json"
    type: "json"
    update_option: "update_as_unapproved"
  # Dash card title and options from plugin.json, which Dux Shell renders
  # itself through I18n.trFor() from translations/<language>.json.
  - source: "/translations/en.json"
    translation: "/translations/%two_letters_code%.json"
    type: "json"
    update_option: "update_as_unapproved"
